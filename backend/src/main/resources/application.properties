spring.application.name=percorsi-api
server.port=${PORT:8080}

# --- Database di sviluppo: H2 salvato in un file locale (cartella ./data) ---
spring.datasource.url=jdbc:h2:file:./data/percorsi_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" = Hibernate crea/aggiorna le tabelle da solo, senza cancellare i dati
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Sicurezza (JWT) ---
# La chiave vera si imposta con la variabile d'ambiente JWT_SECRET (almeno 32 caratteri).
# Il valore qui sotto serve SOLO per lo sviluppo locale: non usarlo online.
app.jwt.secret=${JWT_SECRET:chiave-solo-per-sviluppo-locale-da-cambiare-in-produzione-0123456789}
app.jwt.expiration-ms=86400000

# --- CORS: da quali indirizzi il frontend puo' chiamare l'API (separati da virgola) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
